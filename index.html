<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>羽毛球次数统计</title>

    <!-- SECTION: pwa-meta -->
    <meta name="theme-color" content="#4f46e5">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="羽毛球统计">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="format-detection" content="telephone=no">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon.svg">

    <style>
        /* SECTION: css-variables */
        :root {
            --primary: #4f46e5;
            --primary-light: #818cf8;
            --bg-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-sub: #64748b;
            --danger: #ef4444;
            --success: #10b981;
            --border: #e2e8f0;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }

        /* SECTION: css-reset */
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        html, body {
            overflow-x: hidden;
            width: 100%;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: var(--bg-gradient);
            min-height: 100vh;
            min-height: 100dvh;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            -webkit-font-smoothing: antialiased;
        }

        /* SECTION: css-layout */
        .app-container {
            background: var(--card-bg);
            width: 100%;
            max-width: 480px;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        @media (min-width: 481px) {
            body { padding: 16px; }
            .app-container {
                min-height: auto;
                max-height: calc(100vh - 32px);
                border-radius: 24px;
                box-shadow: var(--shadow);
                overflow: hidden;
            }
        }

        .app-scroll-area {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior: contain;
            padding-bottom: var(--safe-bottom);
        }

        .app-scroll-area::-webkit-scrollbar { width: 4px; }
        .app-scroll-area::-webkit-scrollbar-track { background: transparent; }
        .app-scroll-area::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }

        /* SECTION: css-header */
        .header-section {
            background: linear-gradient(to right, #4f46e5, #7c3aed);
            color: white;
            padding: calc(var(--safe-top) + 16px) 16px 18px;
            text-align: center;
        }

        .app-title {
            margin: 0 0 14px 0;
            font-size: 1.15rem;
            font-weight: 600;
            opacity: 0.92;
            letter-spacing: 1px;
        }

        .stats-row {
            display: flex;
            justify-content: space-around;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 14px;
            padding: 14px 12px;
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
        }

        .stat-box { display: flex; flex-direction: column; align-items: center; }
        .stat-label { font-size: 0.85rem; opacity: 0.8; margin-bottom: 6px; }
        .stat-num { font-size: 2rem; font-weight: 700; line-height: 1; transition: color 0.3s; }
        .stat-num.danger { color: #fca5a5; }

        /* SECTION: css-controls */
        .controls-bar {
            padding: 12px 16px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid var(--border);
            background: #f8fafc;
        }

        .month-nav {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 600;
            color: var(--text-main);
            font-size: 1rem;
            order: 3;
            width: 100%;
            justify-content: center;
        }

        .nav-btn {
            background: white;
            border: 1px solid var(--border);
            width: 36px;
            height: 36px;
            min-width: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--text-sub);
            transition: all 0.15s;
            font-size: 1.3rem;
            -webkit-user-select: none;
            user-select: none;
        }
        .nav-btn:active { background: #f1f5f9; transform: scale(0.92); }

        .settings-group {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85rem;
            color: var(--text-sub);
        }

        .count-input {
            width: 52px;
            padding: 6px 4px;
            border: 1px solid var(--border);
            border-radius: 8px;
            text-align: center;
            font-weight: 600;
            color: var(--text-main);
            font-size: 0.9rem;
            -webkit-appearance: none;
            appearance: none;
        }
        .count-input:focus { border-color: var(--primary); outline: none; }

        .reset-btn {
            background: transparent;
            border: 1px solid var(--danger);
            color: var(--danger);
            padding: 7px 12px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s;
            white-space: nowrap;
        }
        .reset-btn:active { background: #fef2f2; transform: scale(0.95); }

        /* SECTION: css-calendar */
        .calendar-wrapper {
            padding: 12px 12px 28px;
        }

        .weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            margin-bottom: 8px;
            color: var(--text-sub);
            font-size: 0.8rem;
            font-weight: 600;
        }

        .days-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 5px;
        }

        .day-cell {
            aspect-ratio: 1;
            border: 1px solid var(--border);
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 4px 5px;
            cursor: pointer;
            transition: all 0.15s;
            background: white;
            position: relative;
            overflow: hidden;
            min-height: 44px;
        }

        .day-cell:active { transform: scale(0.93); }

        .day-cell.has-data {
            background: #eff6ff;
            border-color: var(--primary-light);
        }

        .day-cell.is-today {
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(79, 70, 229, 0.2);
        }

        .day-cell.empty {
            background: transparent;
            border: none;
            cursor: default;
        }
        .day-cell.empty:active { transform: none; }

        .day-num { font-size: 0.82rem; font-weight: 600; color: var(--text-main); }
        .day-val {
            font-size: 0.72rem;
            color: var(--primary);
            font-weight: 700;
            text-align: right;
            word-break: break-all;
        }

        /* SECTION: css-modal */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal-card {
            background: white;
            width: 100%;
            max-width: 320px;
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            animation: popIn 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        .modal-title { margin: 0 0 16px 0; font-size: 1.1rem; color: var(--text-main); }
        .modal-desc { margin: 0 0 20px 0; font-size: 0.9rem; color: var(--text-sub); line-height: 1.5; }

        .modal-input {
            width: 100%;
            padding: 14px;
            border: 2px solid var(--border);
            border-radius: 12px;
            font-size: 1.3rem;
            text-align: center;
            margin-bottom: 20px;
            outline: none;
            -webkit-appearance: none;
            appearance: none;
        }
        .modal-input:focus { border-color: var(--primary); }

        .modal-actions { display: flex; gap: 10px; }

        .btn {
            flex: 1;
            padding: 14px 8px;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.95rem;
            min-height: 48px;
            transition: transform 0.1s;
        }
        .btn:active { transform: scale(0.97); }
        .btn-secondary { background: #f1f5f9; color: var(--text-sub); }
        .btn-primary { background: var(--primary); color: white; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-outline-danger { background: transparent; border: 1px solid var(--danger); color: var(--danger); }

        /* SECTION: css-install-banner */
        .install-banner {
            display: none;
            background: linear-gradient(to right, #4f46e5, #7c3aed);
            color: white;
            padding: 12px 16px;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            -webkit-user-select: none;
            user-select: none;
        }
        .install-banner.show { display: flex; }
        .install-banner-text { flex: 1; font-size: 0.85rem; font-weight: 500; }
        .install-banner-btn {
            background: rgba(255,255,255,0.25);
            border: none;
            color: white;
            padding: 6px 14px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.82rem;
            cursor: pointer;
            white-space: nowrap;
        }
        .install-banner-close {
            background: none;
            border: none;
            color: white;
            font-size: 1.2rem;
            cursor: pointer;
            opacity: 0.7;
            padding: 4px;
        }

        /* SECTION: css-toast */
        .toast {
            position: fixed;
            bottom: calc(var(--safe-bottom) + 24px);
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: #1e293b;
            color: white;
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: 500;
            z-index: 2000;
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            pointer-events: none;
            white-space: nowrap;
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* SECTION: css-reduced-motion */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>

<!-- SECTION: html-install-banner -->
<div class="install-banner" id="install-banner">
    <span class="install-banner-text">添加到主屏幕，像 App 一样使用</span>
    <button class="install-banner-btn" id="install-btn">安装</button>
    <button class="install-banner-close" id="install-dismiss">&times;</button>
</div>

<div class="app-container">
    <div class="app-scroll-area">
        <!-- SECTION: html-header -->
        <div class="header-section">
            <h1 class="app-title">🏸 羽毛球次数统计</h1>
            <div class="stats-row">
                <div class="stat-box">
                    <span class="stat-label">已使用</span>
                    <span class="stat-num" id="used-display">0</span>
                </div>
                <div class="stat-box">
                    <span class="stat-label">剩余</span>
                    <span class="stat-num" id="remain-display">0</span>
                </div>
            </div>
        </div>

        <!-- SECTION: html-controls -->
        <div class="controls-bar">
            <div class="settings-group">
                <label>初始:</label>
                <input type="number" id="initial-input" class="count-input" value="0" min="0" inputmode="numeric">
            </div>

            <div class="month-nav">
                <button class="nav-btn" id="prev-month" data-primary-action aria-label="上个月">&#8249;</button>
                <span id="current-month-label">2026年 10月</span>
                <button class="nav-btn" id="next-month" data-primary-action aria-label="下个月">&#8250;</button>
            </div>

            <button class="reset-btn" id="open-reset-modal">清零</button>
        </div>

        <!-- SECTION: html-calendar -->
        <div class="calendar-wrapper">
            <div class="weekdays">
                <div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div>
            </div>
            <div class="days-grid" id="calendar-grid"></div>
        </div>
    </div>
</div>

<!-- SECTION: html-input-modal -->
<div class="modal-overlay" id="input-modal">
    <div class="modal-card">
        <h3 class="modal-title" id="modal-date-title">10月1日</h3>
        <input type="number" id="day-value-input" class="modal-input" placeholder="输入次数" step="1" inputmode="numeric">
        <div class="modal-actions">
            <button class="btn btn-outline-danger" id="clear-day-btn">清空</button>
            <button class="btn btn-secondary" id="close-input-btn">取消</button>
            <button class="btn btn-primary" id="save-day-btn" data-primary-action>保存</button>
        </div>
    </div>
</div>

<!-- SECTION: html-reset-modal -->
<div class="modal-overlay" id="reset-confirm-modal">
    <div class="modal-card">
        <h3 class="modal-title">⚠️ 确认清零？</h3>
        <p class="modal-desc">这将删除所有日历记录并将初始次数重置为 0。<br><strong>此操作不可恢复！</strong></p>
        <div class="modal-actions">
            <button class="btn btn-secondary" id="cancel-reset-btn">取消</button>
            <button class="btn btn-danger" id="confirm-reset-btn">确认清零</button>
        </div>
    </div>
</div>

<!-- SECTION: html-toast -->
<div class="toast" id="toast"></div>

<script>
/* SECTION: js-state */
var currentDate = new Date();
var selectedDateKey = null;
var records = {};
var initialCount = 0;
var deferredInstallPrompt = null;

try {
    records = JSON.parse(localStorage.getItem('badminton_records')) || {};
    initialCount = parseInt(localStorage.getItem('badminton_initial')) || 0;
} catch (e) {
    records = {};
    initialCount = 0;
}

/* SECTION: js-dom-refs */
var els = {
    grid: document.getElementById('calendar-grid'),
    monthLabel: document.getElementById('current-month-label'),
    usedDisplay: document.getElementById('used-display'),
    remainDisplay: document.getElementById('remain-display'),
    initialInput: document.getElementById('initial-input'),
    inputModal: document.getElementById('input-modal'),
    modalTitle: document.getElementById('modal-date-title'),
    dayInput: document.getElementById('day-value-input'),
    resetModal: document.getElementById('reset-confirm-modal'),
    toast: document.getElementById('toast'),
    installBanner: document.getElementById('install-banner')
};

/* SECTION: js-utils */
function showToast(msg) {
    els.toast.textContent = msg;
    els.toast.classList.add('show');
    setTimeout(function() { els.toast.classList.remove('show'); }, 2000);
}

function saveData() {
    try {
        localStorage.setItem('badminton_records', JSON.stringify(records));
        localStorage.setItem('badminton_initial', String(initialCount));
    } catch (e) {
        showToast('存储失败，请检查浏览器设置');
    }
}

/* SECTION: js-stats */
function updateStats() {
    var totalUsed = 0;
    for (var key in records) {
        if (records[key]) totalUsed += parseFloat(records[key]);
    }
    var remaining = initialCount - totalUsed;
    els.usedDisplay.textContent = totalUsed % 1 === 0 ? totalUsed : totalUsed.toFixed(1);
    els.remainDisplay.textContent = remaining % 1 === 0 ? remaining : remaining.toFixed(1);
    if (remaining < 0) {
        els.remainDisplay.classList.add('danger');
    } else {
        els.remainDisplay.classList.remove('danger');
    }
}

/* SECTION: js-calendar */
function renderCalendar() {
    var year = currentDate.getFullYear();
    var month = currentDate.getMonth();
    els.monthLabel.textContent = year + '年 ' + (month + 1) + '月';
    els.grid.innerHTML = '';

    var firstDay = new Date(year, month, 1);
    var daysInMonth = new Date(year, month + 1, 0).getDate();
    var startWeekDay = firstDay.getDay();
    var today = new Date();

    for (var i = 0; i < startWeekDay; i++) {
        var emptyCell = document.createElement('div');
        emptyCell.className = 'day-cell empty';
        els.grid.appendChild(emptyCell);
    }

    for (var day = 1; day <= daysInMonth; day++) {
        var dateKey = year + '-' + (month + 1) + '-' + day;
        var value = records[dateKey];

        var cell = document.createElement('div');
        cell.className = 'day-cell';
        if (value) cell.classList.add('has-data');
        if (year === today.getFullYear() && month === today.getMonth() && day === today.getDate()) {
            cell.classList.add('is-today');
        }

        var dayNum = document.createElement('span');
        dayNum.className = 'day-num';
        dayNum.textContent = day;

        var dayVal = document.createElement('span');
        dayVal.className = 'day-val';
        dayVal.textContent = value || '';

        cell.appendChild(dayNum);
        cell.appendChild(dayVal);

        (function(dk, v) {
            cell.addEventListener('click', function() { openInputModal(dk, v); });
        })(dateKey, value);

        els.grid.appendChild(cell);
    }
}

/* SECTION: js-modal */
function openInputModal(dateKey, currentValue) {
    selectedDateKey = dateKey;
    var parts = dateKey.split('-');
    els.modalTitle.textContent = parts[1] + '月' + parts[2] + '日';
    els.dayInput.value = currentValue || '';
    els.inputModal.style.display = 'flex';
    setTimeout(function() { els.dayInput.focus(); }, 100);
}

function closeInputModal() {
    els.inputModal.style.display = 'none';
    selectedDateKey = null;
}

function handleSaveDay() {
    if (!selectedDateKey) return;
    var val = els.dayInput.value.trim();
    if (val === '') {
        delete records[selectedDateKey];
    } else {
        records[selectedDateKey] = val;
    }
    saveData();
    renderCalendar();
    updateStats();
    closeInputModal();
    showToast('已保存');
}

function handleClearDay() {
    if (!selectedDateKey) return;
    delete records[selectedDateKey];
    saveData();
    renderCalendar();
    updateStats();
    closeInputModal();
    showToast('已清空');
}

function handleGlobalReset() {
    records = {};
    initialCount = 0;
    els.initialInput.value = '0';
    saveData();
    renderCalendar();
    updateStats();
    els.resetModal.style.display = 'none';
    showToast('已清零');
}

/* SECTION: js-events */
function bindEvents() {
    document.getElementById('prev-month').addEventListener('click', function() {
        currentDate.setMonth(currentDate.getMonth() - 1);
        renderCalendar();
    });
    document.getElementById('next-month').addEventListener('click', function() {
        currentDate.setMonth(currentDate.getMonth() + 1);
        renderCalendar();
    });

    els.initialInput.addEventListener('change', function(e) {
        var val = parseInt(e.target.value);
        if (isNaN(val) || val < 0) val = 0;
        initialCount = val;
        els.initialInput.value = val;
        saveData();
        updateStats();
    });

    document.getElementById('save-day-btn').addEventListener('click', handleSaveDay);
    document.getElementById('close-input-btn').addEventListener('click', closeInputModal);
    document.getElementById('clear-day-btn').addEventListener('click', handleClearDay);

    els.inputModal.addEventListener('click', function(e) {
        if (e.target === els.inputModal) closeInputModal();
    });
    els.dayInput.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') handleSaveDay();
    });

    document.getElementById('open-reset-modal').addEventListener('click', function() {
        els.resetModal.style.display = 'flex';
    });
    document.getElementById('cancel-reset-btn').addEventListener('click', function() {
        els.resetModal.style.display = 'none';
    });
    document.getElementById('confirm-reset-btn').addEventListener('click', handleGlobalReset);
    els.resetModal.addEventListener('click', function(e) {
        if (e.target === els.resetModal) els.resetModal.style.display = 'none';
    });
}

/* SECTION: js-pwa */
function registerServiceWorker() {
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js').then(function(reg) {
            console.log('SW registered:', reg.scope);
        }).catch(function(err) {
            console.log('SW registration failed:', err);
        });
    }
}

function setupInstallPrompt() {
    window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        deferredInstallPrompt = e;
        els.installBanner.classList.add('show');
    });

    document.getElementById('install-btn').addEventListener('click', function() {
        if (!deferredInstallPrompt) return;
        deferredInstallPrompt.prompt();
        deferredInstallPrompt.userChoice.then(function(result) {
            deferredInstallPrompt = null;
            els.installBanner.classList.remove('show');
            if (result.outcome === 'accepted') {
                showToast('已安装到主屏幕');
            }
        });
    });

    document.getElementById('install-dismiss').addEventListener('click', function() {
        els.installBanner.classList.remove('show');
    });

    window.addEventListener('appinstalled', function() {
        deferredInstallPrompt = null;
        els.installBanner.classList.remove('show');
        showToast('安装成功！可从主屏幕打开');
    });
}

/* SECTION: js-init */
function init() {
    els.initialInput.value = initialCount;
    renderCalendar();
    updateStats();
    bindEvents();
    registerServiceWorker();
    setupInstallPrompt();
}

init();
</script>

</body>
</html>
